<svg width="301" height="165" viewBox="0 0 301 165" fill="none" xmlns="http://www.w3.org/2000/svg" role="img"><title></title><desc></desc><style>.header{font:600 18px 'Segoe UI',Ubuntu,Sans-Serif;fill:#70a5fd;animation:f .8s ease-in-out forwards}.stat{font:600 14px 'Segoe UI',Ubuntu,'Helvetica Neue',Sans-Serif;fill:#38bdae}.bold{font-weight:700}.lang-name{font:400 11px 'Segoe UI',Ubuntu,Sans-Serif;fill:#38bdae}.stagger{opacity:0;animation:f .3s ease-in-out forwards}#rect-mask rect{animation:s 1s ease-in-out forwards}.lang-progress{animation:g .6s ease-in-out forwards}@keyframes s{from{width:0}to{width:calc(100%-100px)}}@keyframes g{from{width:0}to{width:100%}}@keyframes f{from{opacity:0}to{opacity:1}}*{animation-duration:0s!important;animation-delay:0s!important}</style><rect x=".5" y=".5" rx="4.5" height="99%" stroke="#e4e2e2" width="300" fill="#1a1b27" stroke-opacity="1"/><g transform="translate(25,35)"><text x="0" y="0" class="header">Most Used Languages</text></g><g transform="translate(0,55)"><svg x="25"><mask id="rect-mask"><rect x="0" y="0" width="251" height="8" fill="white" rx="5"/></mask><rect mask="url(#rect-mask)" x="0" y="0" width="61.92" height="8" fill="#F05138"/><rect mask="url(#rect-mask)" x="61.92" y="0" width="61.66" height="8" fill="#dea584"/><rect mask="url(#rect-mask)" x="123.58" y="0" width="42.94" height="8" fill="#3572A5"/><rect mask="url(#rect-mask)" x="166.51999999999998" y="0" width="38.52" height="8" fill="#00ADD8"/><rect mask="url(#rect-mask)" x="205.04" y="0" width="27.67" height="8" fill="#A97BFF"/><rect mask="url(#rect-mask)" x="232.70999999999998" y="0" width="18.29" height="8" fill="#00B4AB"/><g transform="translate(0,25)"><g transform="translate(0,0)"><g class="stagger" style="animation-delay:450ms" transform="translate(0,0)"><circle cx="5" cy="6" r="5" fill="#F05138"/><text x="15" y="10" class="lang-name">Swift 24.67%</text></g><g class="stagger" style="animation-delay:600ms" transform="translate(0,25)"><circle cx="5" cy="6" r="5