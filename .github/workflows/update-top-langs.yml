name: Update Top Languages

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-top-langs.yml
      - api/top-langs.js
      - scripts/generate-top-langs.js

permissions:
  contents: write

concurrency:
  group: update-top-langs

jobs:
  update-top-langs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Generate SVG
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/generate-top-langs.js

      - name: Publish SVG
        run: |
          git add assets/top-langs.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Refresh top languages card'
          git push origin HEAD:main
